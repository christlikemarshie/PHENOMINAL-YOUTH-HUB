<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PYH | Phenomenal Youth Hub</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
/* ==========================================================================
   PYH - Phenomenal Youth Hub | style.css
   This file controls how the page LOOKS (colours, fonts, spacing, layout).
   The page structure is in pyh-landing.html and the animation is in script.js.

   Sections in this file:
     1. Colours and fonts (variables)
     2. Basic page setup
     3. Navbar (top bar)
     4. Hero (big photo at the top)
     5. Orbit (the circles moving on the arc)
     6. About, Conference, Sermons, Join, Footer
     7. Phone / tablet screens and reduced motion
   ========================================================================== */


/* ---------- 1. COLOURS AND FONTS ----------
   These are variables. Change a value here and it updates everywhere
   the variable is used, e.g. var(--gold). */
:root {
  --bg: #0E0E0F;      /* page background (almost black) */
  --panel: #18181A;   /* slightly lighter dark, used for cards and bands */
  --text: #F3F1EE;    /* main text colour (soft white) */
  --muted: #B3AEA7;   /* grey text for less important lines */
  --gold: #D9A93A;    /* accent colour for hovers and highlights */
  --glass: rgba(255,255,255,.12);  /* see-through white (not used much) */

  /* Fonts. The list is a fallback order: if the first font does not load,
     the browser uses the next one. */
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
}


/* ---------- 2. BASIC PAGE SETUP ---------- */

/* Applies to every element. border-box makes width include padding and border,
   which makes sizing much easier to predict. margin: 0 removes default gaps. */
* {
  box-sizing: border-box;
  margin: 0;
}

/* Smooth scrolling when you click links like "#about" */
html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;   /* space between lines of text */
}

/* Links take the colour of their surrounding text and lose the underline */
a {
  color: inherit;
  text-decoration: none;
}

/* Gold outline when you move around the page with the keyboard (Tab key).
   Important for accessibility, so keep it. */
:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* .wrap keeps content centred and not too wide on big screens */
.wrap {
  max-width: 1160px;
  margin: 0 auto;      /* auto left and right = centred */
  padding: 0 28px;     /* space from the screen edges */
}


/* ---------- 3. NAVBAR (logo on the left, a small glass pill with the links) ---------- */
.nav {
  position: absolute;   /* sits on top of the hero photo */
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;          /* higher number = drawn in front of other things */
  display: grid;        /* puts logo and links in one row */
  grid-template-columns: 1fr auto 1fr;  /* left space | links | right space.
                                           The two equal "1fr" sides keep the
                                           links in the middle of the bar. */
  align-items: center;
  gap: 20px;
  /* top right bottom left. The left value (56px, was 28px) moves the logo a
     little to the right. The right value (68px) is bigger so the links stay in
     exactly the same spot in the middle as before. */
  padding: 14px 68px 14px 56px;
  /* No background here any more: the glass now belongs to the links pill below. */
}

/* Logo and the "PYH" text stacked on top of each other */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-self: start;   /* keeps the logo on the far left of its column */
  line-height: 1;
}
.brand img {
  height: 52px;
  width: auto;   /* keeps the logo's own shape. It has no background now, so it
                    sits freely on the bar (no circle, no box). */
}
.brand span {
  font-family: var(--serif);
  font-size: 1.35rem;
  letter-spacing: .08em;   /* space between letters */
  margin-top: 4px;
}

/* The menu links (Home, Sermons, ...) inside a small rounded glass pill.
   GLASSMORPHISM, like a Figma glass card: almost clear glass, not a dark tint.
   - fill: white at just 5-6% opacity (the same as the Figma card's 5% white fill)
   - a strong blur and a slight brightening of the photo behind it = frosted glass
   - a bright white edge (the "stroke") with a highlight along the top
   - a very faint diagonal sheen of white, like light across glass
   There is no black in the glass any more, so it stays see-through and light.
   Opacity numbers: lower = clearer, higher = milkier. */
.links {
  display: flex;
  gap: 48px;              /* space between the links */
  font-size: .95rem;
  font-weight: 500;
  padding: 12px 76px;     /* left and right space inside the pill (bigger = wider) */
  border-radius: 999px;   /* very large radius = fully rounded ends */
}

/* The glass look, shared by the link pill and the phone hamburger button, so
   they always match. Change it once here and both update. */
.links,
.menu-btn {
  background:
    linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 55%),   /* faint sheen */
    rgba(255,255,255,.06);                                                         /* the 5-6% white fill */
  border: 1px solid rgba(255,255,255,.45);   /* the bright white edge (stroke) */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),     /* bright line along the top edge */
    inset 0 0 18px rgba(255,255,255,.06),    /* soft glow just inside the edge */
    0 10px 30px rgba(0,0,0,.22);             /* soft shadow so it floats */
  backdrop-filter: blur(26px) brightness(1.12);          /* frosted + a little lighter */
  -webkit-backdrop-filter: blur(26px) brightness(1.12);  /* same thing for Safari */
}

/* HAMBURGER BUTTON (phones and tablets only). A rounded glass box with three
   lines, like the Bootstrap menu button. The three lines turn into an X when the
   menu is open. It is hidden on computers (the media query below shows it). */
.menu-btn {
  display: none;
  width: 48px;
  height: 44px;
  padding: 0;
  border-radius: 12px;
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  justify-self: end;
  color: var(--text);
}
.menu-btn span {
  display: block;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  transition: transform .35s ease, opacity .25s ease;
}
.nav.menu-open .menu-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav.menu-open .menu-btn span:nth-child(2) { opacity: 0; }
.nav.menu-open .menu-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
/* Each link. When you hover over it (or Tab to it with the keyboard):
   - a gold line grows smoothly outwards from the centre of the link
   - the link brightens and lifts up by 1px
   Everything takes half a second and eases in and out, so it feels soft. */
.links a {
  position: relative;      /* lets the gold line be placed inside the link */
  padding: 6px 0 8px;      /* the extra bottom space is where the gold line sits */
  opacity: .85;            /* slightly softer when not hovered */
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.22, .61, .36, 1);
}
.links a::after {          /* the gold line */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  border-radius: 2px;
  background: var(--gold);
  transform: scaleX(0);      /* squashed to nothing = invisible */
  transform-origin: center;  /* grows from the middle outwards */
  transition: transform .5s cubic-bezier(.22, .61, .36, 1);
}
.links a:hover,
.links a:focus-visible {
  opacity: 1;
  transform: translateY(-1px);
}
.links a:hover::after,
.links a:focus-visible::after {
  transform: scaleX(1);      /* full width = the line has grown out */
}


/* ---------- 4. HERO (big photo with the headline) ---------- */
.hero {
  position: relative;   /* lets things inside be positioned relative to the hero */
  height: 100vh;        /* exactly the full height of the screen */
  height: 100svh;       /* better on phones; browsers that know it use this one */
  display: flex;
  align-items: center;  /* centres the headline vertically */
  overflow: hidden;     /* hides anything that sticks out (like half the orbit) */
}

/* The background photo. It fills the whole hero and is turned black and white. */
.hero > img.bg {
  position: absolute;
  inset: 0;                 /* shortcut for top, right, bottom and left = 0 */
  width: 100%;
  height: 100%;
  object-fit: cover;        /* fills the area and crops the edges, no stretching */
  object-position: center 35%;  /* which part of the photo stays visible */
  filter: grayscale(1) contrast(1.05);  /* black and white, a bit more contrast */
  /* Slow, smooth blur in and out. 1.2s = how long it takes.
     The cubic-bezier makes it start gently and ease out softly at the end. */
  transition:
    filter 1.2s cubic-bezier(.22, .61, .36, 1),
    transform 1.2s cubic-bezier(.22, .61, .36, 1);
}

/* When the mouse is over the "Know Jesus" button, blur the whole background
   photo. ":has(...)" means "the hero that contains a hovered button".
   The photo is scaled up a little so the blurred edges do not show dark gaps. */
.hero:has(.glass-btn:hover) > img.bg,
.hero:has(.glass-btn:focus-visible) > img.bg {
  filter: grayscale(1) contrast(1.05) blur(14px);
  transform: scale(1.08);
}

/* A dark layer on top of the photo so the white text is easy to read, plus a
   soft shadowy fade at the bottom that blends the hero into the next section.
   Layer 1 (on top) is the bottom fade. It goes from see-through to the exact
   page colour (14,14,15), so the bottom edge of the hero is the same colour as
   the section below it and there is no visible line between them. The many small
   steps make the fade smooth, like a soft shadow, and it starts high up
   (about 55% of the hero's height) so it is very gradual.
   Layer 2 is darker on the left (where the text is).
   NOTE: the order matters. The fade must be the TOP layer. Before, the dark
   left layer was on top and made the bottom edge blacker than the page, which
   is what created the visible line. */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      0deg,
      rgba(14,14,15,1.000) 0.0%,
      rgba(14,14,15,0.998) 3.4%,
      rgba(14,14,15,0.984) 6.9%,
      rgba(14,14,15,0.951) 10.3%,
      rgba(14,14,15,0.896) 13.8%,
      rgba(14,14,15,0.820) 17.2%,
      rgba(14,14,15,0.725) 20.6%,
      rgba(14,14,15,0.616) 24.1%,
      rgba(14,14,15,0.500) 27.5%,
      rgba(14,14,15,0.384) 30.9%,
      rgba(14,14,15,0.275) 34.4%,
      rgba(14,14,15,0.180) 37.8%,
      rgba(14,14,15,0.104) 41.2%,
      rgba(14,14,15,0.049) 44.7%,
      rgba(14,14,15,0.016) 48.1%,
      rgba(14,14,15,0.002) 51.6%,
      rgba(14,14,15,0.000) 55.0%
    ),
    linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.15) 100%);
}


/* GRAIN: a fine, noisy film-grain texture over the area where the hero fades
   into the page, continuing down through the "WHO WE ARE" section.
   - The noise is a tiny image made by the browser (an SVG filter, no file
     needed). It is made of dark specks (the main part) and a few faint white
     specks, so the grain looks blacker and there is no colour tint.
   - A mask makes the grain fade in gradually over the hero (so it has no hard
     start) and fade out gradually at the bottom of the words section.
   - Both parts use the same noise, so they join without a seam.
   - To make the grain stronger or fainter, change the "opacity" values.
   - To make the grain coarser or finer, change the 220px tile size. */
:root {
  --grain: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='220'%3E%3Cfilter%20id='n'%20color-interpolation-filters='sRGB'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.85'%20numOctaves='2'%20stitchTiles='stitch'%20result='t'/%3E%3CfeColorMatrix%20in='t'%20values='0%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%201.6%200%200%200%20-.72'%20result='w'/%3E%3CfeColorMatrix%20in='t'%20values='0%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%201.8%200%200%20-.62'%20result='k'/%3E%3CfeMerge%3E%3CfeMergeNode%20in='k'/%3E%3CfeMergeNode%20in='w'/%3E%3C/feMerge%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
}

/* The grain "vibrates": every so often the noise picture jumps to a new random
   spot, like the flicker of old film. "steps(1)" makes it jump instantly
   instead of sliding, which is what gives that grainy, buzzing look.
   - .7s (in the two rules below) = how long one cycle of 10 jumps takes.
     Smaller = buzzes faster, bigger = calmer. */
@keyframes grainShift {
  0%   { background-position: 0 0; }
  10%  { background-position: -35px 22px; }
  20%  { background-position: 48px -61px; }
  30%  { background-position: -72px 40px; }
  40%  { background-position: 61px 83px; }
  50%  { background-position: -24px -48px; }
  60%  { background-position: 90px 15px; }
  70%  { background-position: -55px -90px; }
  80%  { background-position: 30px 66px; }
  90%  { background-position: -80px 8px; }
  100% { background-position: 0 0; }
}

/* Part 1: the bottom of the hero (where the fade starts). z-index 1 puts the
   grain above the dark fade but below the headline and button. */
.hero::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 30%;   /* was 40%: the grain now starts lower down */
  z-index: 1;
  pointer-events: none;
  background-image: var(--grain);
  background-size: 220px 220px;
  opacity: .36;
  animation: grainShift .7s steps(1) infinite;   /* the vibrating grain */
  -webkit-mask-image: linear-gradient(0deg, #000 0%, rgba(0,0,0,.93) 10%, rgba(0,0,0,.78) 20%, rgba(0,0,0,.58) 30%, rgba(0,0,0,.38) 42%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.08) 70%, rgba(0,0,0,.02) 85%, transparent 100%);
  mask-image: linear-gradient(0deg, #000 0%, rgba(0,0,0,.93) 10%, rgba(0,0,0,.78) 20%, rgba(0,0,0,.58) 30%, rgba(0,0,0,.38) 42%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.08) 70%, rgba(0,0,0,.02) 85%, transparent 100%);
}

/* Part 2: the whole "WHO WE ARE" section, strongest at the top (where it
   joins the hero) and fading away toward the bottom. */
.words {
  position: relative;
}
.words::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: var(--grain);
  background-size: 220px 220px;
  opacity: .36;
  animation: grainShift .7s steps(1) infinite;   /* the vibrating grain */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.9) 15%, rgba(0,0,0,.72) 30%, rgba(0,0,0,.52) 45%, rgba(0,0,0,.33) 60%, rgba(0,0,0,.16) 75%, rgba(0,0,0,.05) 90%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.9) 15%, rgba(0,0,0,.72) 30%, rgba(0,0,0,.52) 45%, rgba(0,0,0,.33) 60%, rgba(0,0,0,.16) 75%, rgba(0,0,0,.05) 90%, transparent 100%);
}
.words .wrap {
  position: relative;
  z-index: 1;           /* keeps the words above the grain */
  text-align: center;   /* centres "WHO WE ARE" and PHENOMENAL / YOUTH / HUB */
}

/* Container for the headline and button (sits above the dark layer) */
.hero .wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  padding-top: 110px;   /* keeps text clear of the navbar */
}

/* Big headline. clamp(min, preferred, max) makes the size grow with the screen
   width but never go below 3.2rem or above 7rem. */
.hero h1 {
  font-weight: 800;
  font-size: clamp(3.2rem, 8.2vw, 7rem);
  line-height: 1.02;
  letter-spacing: -.025em;
  max-width: 11ch;   /* "ch" = width of a letter, so text wraps after about 11 letters */
  /* A drop-shadow does the same job as the old text-shadow, but it also works
     with the shimmer below (a normal text-shadow would show through the letters). */
  filter: drop-shadow(0 2px 24px rgba(0,0,0,.45));
  /* Gentle floating (see the FLOAT section below). "will-change" tells the
     browser this will move, so it can keep the motion silky smooth. */
  will-change: transform, translate;
  animation:
    float 10s cubic-bezier(.37, 0, .63, 1) infinite,
    drift 14s cubic-bezier(.37, 0, .63, 1) infinite;
}

/* SHIMMER: one big, soft wave that glides slowly across the whole headline,
   over and over. The letters stay white, and a band of black at reduced
   opacity (no colour at all) slowly passes through them.
   How it works: the letters are filled with a wide gradient (white with a
   see-through black band) instead of a plain colour, and the gradient slowly
   slides sideways.
   "@supports" makes sure old browsers that cannot do this keep plain white text. */
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .hero h1 {
    background:
      /* Top layer: a soft band of black at reduced opacity (0.5 = 50% black).
         The many small steps (instead of one straight slope) make the band fade
         in and out very gradually, like a cosine curve, so there are no hard edges.
         It is clear at both ends, so the loop has no seam. */
      linear-gradient(
        100deg,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0) 22%,
        rgba(0, 0, 0, .02) 25.5%,
        rgba(0, 0, 0, .07) 29%,
        rgba(0, 0, 0, .15) 32.5%,
        rgba(0, 0, 0, .25) 36%,
        rgba(0, 0, 0, .35) 39.5%,
        rgba(0, 0, 0, .43) 43%,
        rgba(0, 0, 0, .48) 46.5%,
        rgba(0, 0, 0, .5) 50%,     /* the darkest part of the wave. Lower = fainter */
        rgba(0, 0, 0, .48) 53.5%,
        rgba(0, 0, 0, .43) 57%,
        rgba(0, 0, 0, .35) 60.5%,
        rgba(0, 0, 0, .25) 64%,
        rgba(0, 0, 0, .15) 67.5%,
        rgba(0, 0, 0, .07) 71%,
        rgba(0, 0, 0, .02) 74.5%,
        rgba(0, 0, 0, 0) 78%,
        rgba(0, 0, 0, 0) 100%
      ),
      /* Bottom layer: the plain white of the letters */
      #ffffff;
    background-size: 200% 100%;      /* gradient is twice as wide as the headline */
    -webkit-background-clip: text;   /* clips the gradient to the shape of the letters */
    background-clip: text;
    -webkit-text-fill-color: transparent;   /* lets the gradient show through the letters */
    animation:
      shimmer 16s linear infinite,   /* 16s = one full wave. Bigger = slower. */
      float 10s cubic-bezier(.37, 0, .63, 1) infinite,   /* keeps the floating going too */
      drift 14s cubic-bezier(.37, 0, .63, 1) infinite;
  }
}
@keyframes shimmer {
  from { background-position: 200% 0; }   /* same picture as 0%, so the loop is seamless */
  to   { background-position: 0% 0; }     /* slides the wave across to the right */
}

/* FLOAT: the headline rises a little and sinks back, very slowly, like it is
   hovering on air. Two slow movements run at the same time, with different
   lengths (10s up and down, 14s side to side), so the motion never repeats in
   an obvious, mechanical way. That is what makes it feel soft and natural.
   - "cubic-bezier(.37, 0, .63, 1)" is a sine-wave curve: it speeds up and slows
     down gradually, with no sudden starts or stops.
   - Only movement is animated (no shadow changes), which keeps it very smooth.
   - 11px is how high it rises, 5px is how far it drifts sideways.
   - Bigger seconds = slower. Smaller pixels = subtler. */
@keyframes float {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -11px; }
}
@keyframes drift {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(5px); }
}

/* The "Know Jesus" glass button.
   - It is bigger than before (more padding and larger text).
   - On hover the whole button fills with gold and the text turns dark.
   - Every 4 seconds it does a quick "flick" (see @keyframes flick below)
     to catch the eye and invite people to click. */
.glass-btn {
  display: inline-block;
  margin-top: 40px;
  padding: 24px 64px;
  border-radius: 28px;
  background: rgba(20,20,22,.28);   /* lighter and more see-through than before */
  border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 1.25rem;
  font-weight: 600;
  /* Slow, smooth fade of the gold fill, the text colour and the lift */
  transition:
    background .8s ease,
    color .8s ease,
    border-color .8s ease,
    transform .8s ease;
  animation: flick 4s ease-in-out infinite;   /* repeats forever, once every 4 seconds */
}
.glass-btn:hover,
.glass-btn:focus-visible {
  background: var(--gold);     /* the whole button fills with gold */
  color: #111;                 /* dark text so it stays easy to read */
  border-color: var(--gold);
  transform: translateY(-3px); /* moves up 3px on hover */
  animation: none;             /* stop flicking while the person is on it */
}

/* The flick. The button sits still for most of the 4 seconds, then does a
   quick wiggle and a tiny pop in size near the end, then settles again. */
@keyframes flick {
  0%, 80%, 100% { transform: translateX(0) rotate(0) scale(1); }
  84% { transform: translateX(-7px) rotate(-2deg) scale(1.06); }
  88% { transform: translateX(7px) rotate(2deg) scale(1.06); }
  92% { transform: translateX(-4px) rotate(-1deg) scale(1.03); }
  96% { transform: translateX(3px) rotate(1deg) scale(1.01); }
}

/* ---------- 5. ORBIT (circles moving along the half ring) ----------
   How it works:
   - .orbit is an invisible square. The ring is a circle inside it.
   - Its centre is placed near the RIGHT edge of the screen, so only the
     LEFT half of the ring is visible (the rest is hidden by the hero).
   - script.js moves the circles (.badge) along the arc.
   - The look of each circle is set here. */
.orbit {
  --s: min(540px, 46vw, 68svh);   /* size of the whole orbit: the smallest of these 3 values.
                                     Make 540px smaller to shrink the arc. */
  position: absolute;
  top: 50%;
  right: calc(var(--s) / -2 + 3vw);  /* pushes the orbit right so its centre
                                        is just inside the right edge */
  transform: translateY(-48%);       /* centres it up and down */
  width: var(--s);
  aspect-ratio: 1;                   /* height = width, so it is a square */
  z-index: 2;
  pointer-events: none;              /* clicks go through to the page behind */
}

/* The dashed arc line (an SVG drawn in the HTML) */
.orbit .ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.orbit .ring path {
  stroke-dashoffset: 0;
  animation: flow 60s linear infinite;   /* the dashes slowly drift along the arc */
}
@keyframes flow {
  to { stroke-dashoffset: 140; }   /* moves the dashes forward by 140 units */
}

/* One moving circle. script.js sets its position, size and fade. */
.badge {
  width: 24%;           /* size of each circle compared to the orbit. Change it to resize circles. */
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;   /* tells the browser it will move, so it stays smooth */
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.45));  /* soft shadow under the circle */
}

/* The round frame that holds your picture */
.slot {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;     /* makes it a circle */
  overflow: hidden;       /* crops the picture to the circle */
  background: rgba(255,255,255,.14);
  border: 2px solid rgba(255,255,255,.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid;
  place-items: center;    /* centres the "+" when the slot is empty */
}

/* Your picture fills the whole circle */
.slot img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;   /* crops from the centre instead of stretching */
}

/* When a picture file is missing, the HTML adds the class "empty".
   Then we show a dashed circle with a "+" so you know to add a photo. */
.slot.empty {
  border-style: dashed;
}
.slot.empty::before {
  content: "+";
  font-size: 2.2rem;
  font-weight: 300;
  color: rgba(255,255,255,.9);
  line-height: 1;
}


/* ---------- 6. PAGE SECTIONS ---------- */

/* Space above and below every section */
section {
  padding: 104px 0;
}

/* Section headings */
h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(2.3rem, 5vw, 3.6rem);
  line-height: 1.05;
  margin-bottom: 20px;
}

/* Grey intro paragraph under a heading */
.lead {
  color: var(--muted);
  font-size: 1.1rem;
  max-width: 52ch;   /* stops lines from getting too long to read */
  margin-bottom: 14px;
}

/* --- About: photo on the left, text on the right --- */
.about {
  display: grid;
  grid-template-columns: .85fr 1.15fr;   /* two columns, the second a bit wider */
  gap: 64px;
  align-items: center;
}
.about img {
  width: 100%;
  border-radius: 200px 200px 16px 16px;   /* arch shape: round top, slightly round bottom */
  aspect-ratio: 4/5;
  object-fit: cover;
  object-position: center 20%;   /* keeps the face in view */
}

/* --- Conference band --- */
.conf {
  background: var(--panel);
  text-align: center;
}
.conf .theme {   /* "Satisfy us early" */
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  color: var(--gold);
  margin: 6px 0 18px;
}
.conf .lead {
  margin-left: auto;    /* auto on both sides centres the paragraph */
  margin-right: auto;
}
.conf blockquote {   /* the Bible verse */
  max-width: 40ch;
  margin: 28px auto 0;
  color: var(--muted);
  font-size: 1.05rem;
}
.conf cite {   /* "Psalm 90:14" */
  display: block;
  font-style: normal;
  font-weight: 600;
  margin-top: 6px;
  color: var(--text);
}

/* --- Sermon cards: 3 in a row --- */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* 3 equal columns */
  gap: 20px;
  margin-top: 32px;
}
.card {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 28px;
}
.card h3 {
  font-size: 1.25rem;
  margin-bottom: 8px;
}
.card p {
  color: var(--muted);
  font-size: .96rem;
}
.tag {   /* the small "Coming soon" label */
  display: inline-block;
  margin-top: 18px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 3px 12px;
  border-radius: 999px;
}

/* --- Join / sign-up section --- */
.join {
  text-align: center;
}
.join form {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;   /* on small screens the button drops under the input */
  margin-top: 26px;
}
.join input {   /* email box */
  flex: 1 1 260px;   /* can grow and shrink, prefers 260px wide */
  max-width: 340px;
  padding: 14px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.25);
  background: var(--panel);
  color: var(--text);
  font: inherit;   /* use the same font as the page */
}
.join button {
  border: 0;
  cursor: pointer;   /* hand cursor on hover */
  font: inherit;
  font-weight: 700;
  padding: 14px 30px;
  border-radius: 999px;
  background: var(--text);
  color: #111;
}
.join button:hover {
  background: var(--gold);
}
#msg {   /* the "Thank you" message (written by script.js) */
  margin-top: 14px;
  color: var(--muted);
  min-height: 1.5em;   /* reserves space so the page does not jump when text appears */
}

/* --- Footer --- */
footer {
  border-top: 1px solid rgba(255,255,255,.1);
  padding: 32px 0;
  color: var(--muted);
  font-size: .9rem;
}
footer .wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
}
footer nav {
  display: flex;
  gap: 22px;
}


/* ---------- 8. SCROLL ANIMATIONS ----------
   The hidden starting states only apply when JavaScript is running (the class
   "js-on" is added by script.js), so nothing stays invisible if it fails.
   script.js adds the class "in" when something scrolls into view. */

/* Gold progress bar at the very top. script.js stretches it with scaleX. */
.progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  z-index: 20;
}

/* .reveal = fades in and rises. "--d" is an optional delay (stagger). */
.js-on .reveal {
  opacity: 0;
  transform: translateY(60px);
  transition: opacity 1s ease, transform 1.1s cubic-bezier(.22, .61, .36, 1);
  transition-delay: var(--d, 0s);
}
.js-on .reveal.in {
  opacity: 1;
  transform: none;
}

/* .mask = an invisible window that hides the words until they slide into it
   (used by the looping PHENOMENAL / YOUTH / HUB words) */
.mask {
  display: block;
  overflow: hidden;
  padding-bottom: .08em;   /* stops letters like "g" from being cut off */
}
.mask > span {
  display: block;
}

/* Huge editorial words (PHENOMENAL / YOUTH / HUB) */
.big {
  font-family: var(--sans);
  font-weight: 800;
  font-size: clamp(3.5rem, 13vw, 10rem);
  line-height: .98;
  letter-spacing: -.03em;
  margin: 0;
}
.words .mask:nth-child(even) {
  color: var(--muted);   /* every second word is softer, for rhythm */
}
.words .big {
  font-size: clamp(2.6rem, 11vw, 9rem);   /* a bit smaller so "PHENOMENAL" always fits */
}

/* The looping PHENOMENAL / YOUTH / HUB animation is done by script.js (see the
   WORDS LOOP block there), so there are no keyframes for it here any more.
   Each letter of PHENOMENAL is wrapped in a <span class="ch"> by the script;
   "inline-block" is what lets a single letter be moved. */
.loop-text .ch {
  display: inline-block;
}

.kicker {
  color: var(--gold);
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .3em;
  margin-bottom: 24px;
}
.words {
  padding: 140px 0;
}

@media (max-width: 900px) {
  .words { padding: 90px 0; }
}


/* ---------- 7. SMALLER SCREENS AND ACCESSIBILITY ---------- */

/* Tablets and phones (screens 900px wide or less) */
@media (max-width: 900px) {
  /* --- Navbar: logo on the left, hamburger button on the right --- */
  .nav {
    grid-template-columns: 1fr auto;
    padding: 12px 18px;
  }
  .menu-btn { display: flex; }

  /* The links become a glass dropdown under the bar. It is invisible until the
     button is pressed (script.js adds the class "menu-open" to the navbar). */
  .links {
    position: absolute;
    top: calc(100% + 6px);
    left: 18px;
    right: 18px;
    flex-direction: column;
    gap: 2px;
    padding: 12px 22px;
    border-radius: 26px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px) scale(.98);
    transform-origin: top right;
    transition:
      opacity .35s ease,
      transform .35s cubic-bezier(.22, .61, .36, 1),
      visibility 0s linear .35s;   /* stays "visible" until the fade-out finishes */
  }
  .nav.menu-open .links {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: 0s;
  }
  .links a {
    padding: 12px 0 14px;
    font-size: 1.05rem;
  }

  /* --- The orbit wheel stays on phones: smaller, and placed in the lower part
     of the hero (under the headline and button) so it does not cover the text --- */
  .orbit {
    --s: min(100vw, 44svh);          /* size of the wheel (smaller number = smaller wheel) */
    top: auto;
    bottom: 4svh;                    /* distance from the bottom of the hero */
    transform: none;
    right: calc(var(--s) / -2 + 2vw);
  }
  .hero { align-items: flex-start; }                /* headline sits near the top */
  .hero .wrap { padding-top: 120px; }
  .about, .cards { grid-template-columns: 1fr; }   /* stack columns into one */
  .about img { max-width: 380px; margin: 0 auto; }
  section { padding: 72px 0; }
  .hero h1 {
    max-width: 12ch;
    font-size: clamp(2.6rem, 11vw, 4rem);   /* smaller headline on phones, so the button and wheel have room */
  }
  .glass-btn { padding: 20px 48px; font-size: 1.15rem; }   /* a little smaller on phones */
}

/* For people who set their device to reduce motion:
   turn off smooth scrolling, hover animations, the button flick
   the headline shimmer and the headline floating. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
  .glass-btn { animation: none; }
  .hero h1 { animation: none; }   /* no headline shimmer or floating */
  .hero::before, .words::before { animation: none; }   /* grain stays still */
}

    <script>
/* ---------- 2. ORBIT ANIMATION ----------
   Idea: each circle has a "progress" number p between 0 and 1.
     p = 0    -> start of the arc (bottom)
     p = 0.5  -> middle of the arc (left side)
     p = 1    -> end of the arc (top)
   As time passes, p grows. When it reaches 1 it wraps back to 0,
   so the circle disappears at the top and reappears at the bottom.
   From p we work out where the circle is, how big it is, and how visible it is.

   The code is wrapped in (() => { ... })(); so its variables stay
   private and do not clash with other code. */

(() => {
  // --- Find the things we need on the page ---

  // The invisible square holding the arc
  const orbit = document.querySelector(".orbit");

  // If it is not on the page, stop here
  if (!orbit) return;

  // All the circles (each has the class "badge"), turned into a normal list
  const badges = Array.from(orbit.querySelectorAll(".badge"));

  // Did the person ask their device to reduce motion? (true or false)
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- Settings you can change ---

  // Time for one circle to travel the whole arc, in milliseconds
  // (24000 = 24 seconds; bigger number = slower)
  const LAP = 24000;

  // Size of the arc as a fraction of the orbit size
  // (bigger number = bigger curve)
  const RADIUS = 0.38;

  // How much of the arc is used to fade in and out
  // (0.12 = the first and last 12%)
  const FADE = 0.12;

  // Current width of the orbit, filled in by measure()
  // (let, because this value changes)
  let size = 0;

  // Reads the orbit's current width in pixels
  const measure = () => {
    size = orbit.clientWidth;
  };

  // Makes a number between 0 and 1 change gently (slow at the ends, faster in
  // the middle) instead of in a straight line. This makes the fade look smooth.
  const smooth = (x) => x * x * (3 - 2 * x);

  // Puts every circle in the right place for the time "t" (in milliseconds)
  const place = (t) => {
    // The centre of the orbit (same for x and y)
    const c = size / 2;

    // The radius of the arc in pixels
    const r = size * RADIUS;

    // i = 0, 1, 2 for the three circles
    badges.forEach((b, i) => {
      // 1) PROGRESS: how far along the arc this circle is (0 to 1).
      //    "% 1" wraps the number back to 0 after it reaches 1.
      //    "i / badges.length" spaces the circles evenly apart.
      //    With reduced motion we use fixed positions so nothing moves.
      const p = reduce ? [0.2, 0.5, 0.8][i] : (t / LAP + i / badges.length) % 1;

      // 2) ANGLE: turns progress into an angle on a circle.
      //    Starts at the bottom (90 degrees) and moves half a turn
      //    (180 degrees) up to the top.
      //    Angles here are in radians (Math.PI = 180 degrees).
      const a = Math.PI / 2 + Math.PI * p;

      // 3) VISIBILITY (opacity): 0 at the very start and end of the arc,
      //    1 everywhere else. This is the fade in and fade out.
      const vis = reduce
        ? 1
        : smooth(Math.max(0, Math.min(1, p / FADE, (1 - p) / FADE)));

      // 4) POSITION: cos and sin turn the angle into x and y on the circle.
      //    We subtract half the circle's width so its CENTRE sits on the arc,
      //    not its top-left corner.
      const w = b.offsetWidth;

      // Tiny up-and-down floating
      const bob = reduce ? 0 : Math.sin(t / 1400 + i * 2) * size * 0.01;

      const x = c + r * Math.cos(a) - w / 2;
      const y = c + r * Math.sin(a) - w / 2 + bob;

      // 5) SIZE: Math.sin(PI * p) is 0 at the ends and 1 in the middle.
      //    So the circle is small when it appears, biggest in the middle,
      //    and small again when it disappears.
      const m = reduce ? 1 : Math.sin(Math.PI * p);

      // Scale from 35% (smallest) up to 100% (biggest)
      const sc = 0.35 + 0.65 * m;

      // 6) APPLY everything to the circle on the page
      b.style.opacity = vis;
      b.style.transform = `translate(${x}px,${y}px) scale(${sc})`;
    });
  };

  // Runs again and again (about 60 times a second) to keep things moving.
  // "now" is the time in milliseconds given by the browser.
  const frame = (now) => {
    place(now);

    // Ask the browser to call frame() again for the next screen refresh
    requestAnimationFrame(frame);
  };

  // --- Start everything ---

  // Read the size once at the start
  measure();

  // ...and again if the window size changes
  window.addEventListener("resize", () => {
    measure();
    place(performance.now());
  });

  // Draw the first position straight away
  place(performance.now());

  // Start the animation (unless motion is reduced)
  if (!reduce) requestAnimationFrame(frame);
})();


/* ---------- 3. SCROLL ANIMATIONS ----------
   - Anything with class "reveal" gets the class "in" when it
     scrolls into view (style.css then animates it).
   - The gold bar at the top shows how far down the page you are.
   We use IntersectionObserver (the browser tells us when something appears)
   instead of listening to every scroll event, which is smoother and lighter. */

(() => {
  // Tells the CSS that JavaScript works, so hidden-until-scrolled styles apply.
  document.documentElement.classList.add("js-on");

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const targets = document.querySelectorAll(".reveal");

  if (reduce || !("IntersectionObserver" in window)) {
    // No motion wanted: show everything straight away
    targets.forEach((el) => el.classList.add("in"));
  } else {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("in");
          observer.unobserve(entry.target);   // animate only once
        });
      },
      { threshold: 0.25 }
    );
    targets.forEach((el) => observer.observe(el));
  }

  // Scroll progress bar (gold line at the very top)
  const bar = document.querySelector(".progress");
  if (bar && !reduce) {
    let ticking = false;
    const update = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = `scaleX(${max > 0 ? window.scrollY / max : 0})`;
      ticking = false;
    };
    window.addEventListener("scroll", () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(update);
      }
    });
    update();
  }
})();


/* ---------- 4. WORDS LOOP ----------
   PHENOMENAL / YOUTH / HUB: every round (5 seconds) the words arrive, stay
   together, slide up and away, then start again.
     - PHENOMENAL: its letters slide in from the left, one by one
     - YOUTH: slides in from the right
     - HUB: slides in from the bottom
   In the HTML each word just has data-from="letters", "right" or "bottom".
   This uses the Web Animations API: element.animate(keyframes, options),
   which does the same job as CSS @keyframes but is controlled from JavaScript. */

(() => {
  const words = document.querySelectorAll(".loop-text .mask > span");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!words.length || reduce) return;   // no motion wanted: the words just stay put

  // --- Settings you can change ---
  const ROUND = 5000;       // length of one full round, in milliseconds (bigger = slower)
  const WORD_GAP = 100;     // delay between the words, in milliseconds
  const LETTER_GAP = 60;    // delay between the letters of PHENOMENAL, in milliseconds

  // Where each kind of word waits before it slides in (x y, in the word's own size)
  const START = {
    left: "translate(-100%, 0)",
    right: "translate(100%, 0)",
    bottom: "translate(0, 110%)",
    letters: "translate(-0.5em, 0)",   // each single letter starts a little to the left
  };

  const SMOOTH = "cubic-bezier(.65, 0, .35, 1)";   // gentle start and stop

  // Plays the loop on one element, starting after "delay" milliseconds
  const play = (el, from, delay, fade) => {
    const hidden = fade ? { opacity: 0 } : {};
    const shown = fade ? { opacity: 1 } : {};
    el.animate(
      [
        { ...hidden, transform: START[from], offset: 0, easing: SMOOTH },            // waiting
        { ...shown, transform: "translate(0, 0)", offset: 0.2, easing: "linear" },   // arrived
        { ...shown, transform: "translate(0, 0)", offset: 0.72, easing: SMOOTH },    // staying
        { ...shown, transform: "translate(0, -110%)", offset: 0.86 },                // slid up and away
        { ...shown, transform: "translate(0, -110%)", offset: 1 },
      ],
      { duration: ROUND, delay, iterations: Infinity, fill: "backwards" }
    );
  };

  words.forEach((word, i) => {
    const from = word.dataset.from;

    if (from === "letters") {
      // Wrap every letter in its own <span> so each one can move on its own.
      // The whole word gets a label so screen readers still read it as one word.
      const text = word.textContent.trim();
      word.setAttribute("aria-label", text);
      word.textContent = "";
      [...text].forEach((letter, n) => {
        const span = document.createElement("span");
        span.className = "ch";
        span.setAttribute("aria-hidden", "true");
        span.textContent = letter;
        word.appendChild(span);
        play(span, "letters", i * WORD_GAP + n * LETTER_GAP, true);
      });
    } else {
      play(word, from, i * WORD_GAP, false);
    }
  });
})();


/* ---------- 5. MOBILE MENU ----------
   The hamburger button opens and closes the glass dropdown on phones.
   It works by adding or removing the class "menu-open" on the navbar; the
   look of both states is in style.css. The menu also closes when you tap a
   link, tap outside it, press Escape, or make the screen wide again. */

(() => {
  const nav = document.querySelector(".nav");
  const btn = document.querySelector(".menu-btn");
  if (!nav || !btn) return;

  const setOpen = (open) => {
    nav.classList.toggle("menu-open", open);
    btn.setAttribute("aria-expanded", String(open));
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  };

  btn.addEventListener("click", () => setOpen(!nav.classList.contains("menu-open")));
  nav.querySelectorAll(".links a").forEach((link) => {
    link.addEventListener("click", () => setOpen(false));
  });
  document.addEventListener("click", (e) => {
    if (!nav.contains(e.target)) setOpen(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setOpen(false);
  });
  window.matchMedia("(min-width: 901px)").addEventListener("change", () => setOpen(false));
})();

  </script>

  </body>
